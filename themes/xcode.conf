# Xcode theme
# Apple's default light.

# --- General palette ------------------------------------------------------

set Config(accent)       "#007AFF"
set Config(bg)           "#D9D9D9"
set Config(fg)           "#000000"

# --- Chrome backgrounds ---------------------------------------------------

set Config(toolbar_bg)   "#ECECEC"
set Config(sidebar_bg)   "#ECECEC"
set Config(window_bg)    "#FFFFFF"
set Config(titlebar_bg)  "#ECECEC"
set Config(border)       "#C7C7CC"

# --- Fonts ----------------------------------------------------------------

set Config(font)         {"Menlo" 11}
set Config(font_bold)    {"Menlo" 11}
set Config(ui_font)      {"Helvetica Neue" 10}

# --- Text colors ----------------------------------------------------------

set Config(status_fg)    "#5A5A5F"
set Config(title_fg)     "#000000"
set Config(list_fg)      "#000000"
set Config(header_fg)    "#5A5A5F"
set Config(insert_color) "#000000"

# --- Hover states ---------------------------------------------------------

set Config(close_hover)  "#C41A16"
set Config(min_hover)    "#1C01CE"
set Config(btn_hover_bg) "#D6E4FF"
set Config(hover_fg)     "#000000"

# --- Selection ------------------------------------------------------------

set Config(sel_bg)       "#BBDFFF"
set Config(sel_fg)       "#000000"

# --- Scrollbars and line numbers -----------------------------------------

set Config(scroll_bg)    "#8E8E93"
set Config(linenum_bg)   "#FFFFFF"
set Config(linenum_fg)   "#8E8E93"

set Config(show_scrollbars) 1

# --- File tree ------------------------------------------------------------

set Config(tree_show_hidden) 0

# --- Syntax highlighting --------------------------------------------------

set Config(syntax_highlight) 1

set Config(hl_keyword)   "#AA0D91"
set Config(hl_comment)   "#007400"
set Config(hl_string)    "#C41A16"
set Config(hl_number)    "#1C01CE"
set Config(hl_punct)     "#000000"
set Config(hl_preproc)   "#633820"
