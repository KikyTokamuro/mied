# Acme theme
# A light theme in the spirit of Plan 9's acme.

# --- General palette ------------------------------------------------------

set Config(accent)       "#8888CC"
set Config(bg)           "#EFEFEF"
set Config(fg)           "#000000"

# --- Chrome backgrounds ---------------------------------------------------

set Config(toolbar_bg)   "#EAFFFF"
set Config(sidebar_bg)   "#EAFFFF"
set Config(window_bg)    "#FFFFEA"
set Config(titlebar_bg)  "#EAFFFF"
set Config(border)       "#8888CC"

# --- Fonts ----------------------------------------------------------------

set Config(font)         {"Menlo" 11}
set Config(font_bold)    {"Menlo" 11 bold}
set Config(ui_font)      {"Menlo" 10}

# --- Text colors ----------------------------------------------------------

set Config(status_fg)    "#000000"
set Config(title_fg)     "#000000"
set Config(list_fg)      "#000000"
set Config(header_fg)    "#000099"
set Config(insert_color) "#000000"

# --- Hover states ---------------------------------------------------------

set Config(close_hover)  "#AA0000"
set Config(min_hover)    "#000099"
set Config(btn_hover_bg) "#9EEEEE"
set Config(hover_fg)     "#000000"

# --- Selection ------------------------------------------------------------

set Config(sel_bg)       "#EEEE9E"
set Config(sel_fg)       "#000000"

# --- Scrollbars and line numbers -----------------------------------------

set Config(scroll_bg)    "#8888CC"
set Config(linenum_bg)   "#EAFFFF"
set Config(linenum_fg)   "#6E6E6E"

set Config(show_scrollbars) 1

# --- File tree ------------------------------------------------------------

set Config(tree_show_hidden) 0

# --- Syntax highlighting --------------------------------------------------

set Config(syntax_highlight) 1

set Config(hl_keyword)   "#000000"
set Config(hl_comment)   "#6E6E6E"
set Config(hl_string)    "#3E7E3E"
set Config(hl_number)    "#000099"
set Config(hl_punct)     "#76762D"
set Config(hl_preproc)   "#AA0000"
