# Nord theme
# A minimalist, frosty theme inspired by the Nord palette.

# --- General palette ------------------------------------------------------

set Config(accent)       "#88C0D0"
set Config(bg)           "#444a57"
set Config(fg)           "#D8DEE9"

# --- Chrome backgrounds ---------------------------------------------------

set Config(toolbar_bg)   "#3B4252"
set Config(sidebar_bg)   "#3B4252"
set Config(window_bg)    "#2E3440"
set Config(titlebar_bg)  "#3B4252"
set Config(border)       "#4C566A"

# --- Fonts ----------------------------------------------------------------

set Config(font)         {"Menlo" 10}
set Config(font_bold)    {"Menlo" 10 bold}
set Config(ui_font)      {"Menlo" 9}

# --- Text colors ----------------------------------------------------------

set Config(status_fg)    "#81A1C1"
set Config(title_fg)     "#ECEFF4"
set Config(list_fg)      "#D8DEE9"
set Config(header_fg)    "#8FBCBB"
set Config(insert_color) "#ECEFF4"

# --- Hover states ---------------------------------------------------------

set Config(close_hover)  "#BF616A"
set Config(min_hover)    "#5E81AC"
set Config(btn_hover_bg) "#434C5E"
set Config(hover_fg)     "#ECEFF4"

# --- Selection ------------------------------------------------------------

set Config(sel_bg)       "#88C0D0"
set Config(sel_fg)       "#2E3440"

# --- Scrollbars and line numbers -----------------------------------------

set Config(linenum_bg)   "#2E3440"
set Config(linenum_fg)   "#4C566A"

set Config(show_scrollbars) 0

# --- File tree ------------------------------------------------------------

set Config(tree_show_hidden) 0

# --- Syntax highlighting --------------------------------------------------

set Config(syntax_highlight) 1

set Config(hl_keyword)   "#81A1C1"
set Config(hl_comment)   "#616E88"
set Config(hl_string)    "#A3BE8C"
set Config(hl_number)    "#B48EAD"
set Config(hl_punct)     "#8FBCBB"
set Config(hl_preproc)   "#5E81AC"
